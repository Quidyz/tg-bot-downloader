services:
  # Локальный Bot API — поднимает лимит отправки файлов с 50 МБ до 2 ГБ.
  # Требует TELEGRAM_API_ID/TELEGRAM_API_HASH в .env (с https://my.telegram.org).
  # Перед первым запуском отвяжи бота от облачного API:
  #   curl https://api.telegram.org/bot<BOT_TOKEN>/logOut
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_API_BASE: http://telegram-bot-api:8081
      DB_PATH: /app/data/bot.db
    volumes:
      - ./data:/app/data
    depends_on:
      - telegram-bot-api

volumes:
  telegram-bot-api-data:
