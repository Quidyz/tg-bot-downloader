services:
  # Локальный Bot API для файлов >50 МБ.
  # Раскомментируй эту секцию (и TELEGRAM_API_BASE в bot->environment),
  # когда понадобятся файлы больше 50 МБ.
  # telegram-bot-api:
  #   image: aiogram/telegram-bot-api:latest
  #   restart: unless-stopped
  #   environment:
  #     TELEGRAM_API_ID: ${TELEGRAM_API_ID}
  #     TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
  #     TELEGRAM_LOCAL: 1
  #   volumes:
  #     - telegram-bot-api-data:/var/lib/telegram-bot-api

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Используем официальный API (лимит 50 МБ).
      # Для >50 МБ раскомментируй строку ниже и uncomment сервис telegram-bot-api.
      # TELEGRAM_API_BASE: http://telegram-bot-api:8081
      DB_PATH: /app/data/bot.db
    volumes:
      - ./data:/app/data
    # depends_on:
    #   - telegram-bot-api

# volumes:
#   telegram-bot-api-data:
