services:
  # Локальный Bot API поднимает лимит отправки с 50 МБ до 2 ГБ.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID is required}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH is required}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8081/" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  bot:
    build:
      context: .
      args:
        CACHEBUST: "${CACHEBUST:-1}"
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TELEGRAM_API_BASE: http://telegram-bot-api:8081
      DB_PATH: /app/data/bot.db
    volumes:
      - ./data:/app/data
    depends_on:
      telegram-bot-api:
        condition: service_healthy

volumes:
  telegram-bot-api-data:
